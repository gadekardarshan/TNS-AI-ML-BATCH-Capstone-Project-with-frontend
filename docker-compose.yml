version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heart_disease_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - ARTIFACT_PATH=/app/models/final_model_artifact.pkl
      - JWT_SECRET_KEY=hospital-dashboard-super-secret-key-2026

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heart_disease_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
